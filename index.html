<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>想对你说的话</title>
    <style>
body{
    max-width:700px;
    margin:40px auto;
    padding:0 20px;
    font-family:system-ui;
    background:#1a1a1a;
    color:#ffffff;  /*主体文字纯白色*/
    line-height:1.7;
}
.item{
    background:#2c2c2c;
    padding:20px;
    margin:18px 0;
    border-radius:10px;
}
.date{
    color:#cccccc; /*日期浅灰色，和正文区分开*/
    font-size:14px;
    margin-bottom:8px;
}
    </style>
</head>
<body>
    <h2>写给你的话</h2>
    <!-- 每次新增日记，就在下面新增一段item，最新的放最上面 -->
    <div class="item">
        <div class="date">2026-10-06</div>
        <p>今天想对你说的话……</p>
    </div>
</body>
</html>
